{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HomeParty{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
  </head>
  <body>
    {% include "includes/navigation.html" %}
    <main class="container page-content" id="main-content">
      {% block content %}{% endblock %}
    </main>
    <footer class="container site-footer">
      <p>© <span id="current-year"></span> HomeParty · Домашние праздники</p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
  </body>
</html>
